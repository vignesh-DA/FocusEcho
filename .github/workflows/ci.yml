name: FocusEcho CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.8
  PASS_THRESHOLD_PERCENT: 100

jobs:
  checks:
    name: Backend, Flutter, and extension checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create report directory
        run: mkdir -p test-results

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        id: backend_deps
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install -r backend/requirements.txt pytest==8.3.5 2>&1 | tee test-results/backend-install.log

      - name: Install QA automation dependencies
        id: qa_deps
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pip install -r automation/requirements.txt pytest==8.3.5 2>&1 | tee test-results/qa-install.log

      - name: Validate QA test catalogue and runner
        id: qa_quality
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest automation/test_quality_controls.py automation/tests/test_full_suite_report.py -q --junitxml=test-results/qa-quality-junit.xml 2>&1 | tee test-results/qa-quality.log

      - name: Run Selenium acceptance tests on local static web app
        id: selenium
        if: always()
        continue-on-error: true
        env:
          TEST_ENV: local
          BASE_URL: http://127.0.0.1:8081/
          BROWSER: chrome
          HEADLESS: 'true'
          PASS_PERCENTAGE_THRESHOLD: ${{ env.PASS_THRESHOLD_PERCENT }}
          MAX_CRITICAL_FAIL_PERCENTAGE: '0'
        run: |
          set -o pipefail
          python -m http.server 8081 --directory web > test-results/web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8081/ > /dev/null; then break; fi
            sleep 0.5
          done
          python -m automation.runner 2>&1 | tee test-results/selenium.log

      - name: Run local load smoke suite
        id: load
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -u automation/load/runner.py 2>&1 | tee test-results/load.log

      - name: Run local vulnerability suite
        id: vulnerability
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          python -u automation/vulnerability/runner.py 2>&1 | tee test-results/vulnerability.log

      - name: Run backend tests
        id: backend
        if: always()
        continue-on-error: true
        working-directory: backend
        run: |
          set -o pipefail
          python -m pytest app/tests -q --junitxml=../test-results/backend-junit.xml 2>&1 | tee ../test-results/backend.log

      - uses: subosito/flutter-action@v2
        id: flutter_setup
        if: always()
        continue-on-error: true
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get Flutter dependencies and generate sources
        id: flutter_deps
        if: always()
        continue-on-error: true
        working-directory: mobile_app
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee ../test-results/flutter-dependencies.log
          dart run build_runner build --delete-conflicting-outputs 2>&1 | tee -a ../test-results/flutter-dependencies.log

      - name: Analyze Flutter
        id: flutter_analyze
        if: always()
        continue-on-error: true
        working-directory: mobile_app
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos 2>&1 | tee ../test-results/flutter-analyze.log

      - name: Test Flutter
        id: flutter_test
        if: always()
        continue-on-error: true
        working-directory: mobile_app
        run: |
          set -o pipefail
          flutter test --no-pub --reporter expanded --file-reporter json:../test-results/flutter-test.json 2>&1 | tee ../test-results/flutter-test.log

      - uses: actions/setup-node@v4
        id: node_setup
        if: always()
        continue-on-error: true
        with:
          node-version: '22'

      - name: Install extension dependencies
        id: extension_deps
        if: always()
        continue-on-error: true
        working-directory: browser_extension
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: |
          set -o pipefail
          npm install --no-package-lock --no-audit --no-fund 2>&1 | tee ../test-results/extension-install.log

      - name: Test browser extension
        id: extension
        if: always()
        continue-on-error: true
        working-directory: browser_extension
        run: |
          set -o pipefail
          npm run test:all 2>&1 | tee ../test-results/extension.log

      - name: Evaluate shared pass threshold
        id: gate
        if: always()
        env:
          BACKEND_RESULT: ${{ steps.backend.outcome }}
          FLUTTER_ANALYZE_RESULT: ${{ steps.flutter_analyze.outcome }}
          FLUTTER_TEST_RESULT: ${{ steps.flutter_test.outcome }}
          EXTENSION_RESULT: ${{ steps.extension.outcome }}
          QA_QUALITY_RESULT: ${{ steps.qa_quality.outcome }}
          SELENIUM_RESULT: ${{ steps.selenium.outcome }}
          LOAD_RESULT: ${{ steps.load.outcome }}
          VULNERABILITY_RESULT: ${{ steps.vulnerability.outcome }}
        run: python scripts/evaluate_gate.py

      - name: Build combined full-suite Excel report
        if: always()
        run: python -m automation.reports.full_suite_excel_report

      - name: Upload test reports and raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focusecho-test-results
          path: |
            test-results/
            Test Results/
          if-no-files-found: warn

  debug-apk:
    name: Build and upload debug APK
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build debug APK
        working-directory: mobile_app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build apk --debug --no-tree-shake-icons

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focusecho-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
