name: Build and Release Android APK

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*' # Triggers on tags starting with v, e.g. v1.0.0

permissions:
  contents: read

jobs:
  verify:
    name: Verify Flutter, backend, and extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Generate Flutter model and provider code
        working-directory: mobile_app
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
      - name: Analyze and test Flutter
        working-directory: mobile_app
        run: |
          flutter analyze --no-pub --no-fatal-infos
          flutter test --no-pub
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s app/tests -p 'test_*.py' -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test extension
        working-directory: browser_extension
        run: npm run test:all

  build:
    name: Build & Release APK
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: |
          cd mobile_app
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build Release APK
        run: |
          cd mobile_app
          flutter build apk --release --no-tree-shake-icons

      - name: Rename APK
        run: |
          mv mobile_app/build/app/outputs/flutter-apk/app-release.apk mobile_app/build/app/outputs/flutter-apk/FocusEchoAI-release.apk

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v1
        with:
          files: mobile_app/build/app/outputs/flutter-apk/FocusEchoAI-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            Automatic build of FocusEcho AI Android Application for release ${{ github.ref_name }}.
            
            ### Download
            - **[FocusEchoAI-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/FocusEchoAI-release.apk)** - Download and install on your physical Android device.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
