name: focus_echo_ai
description: Real-time focus recovery platform
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5
  supabase_flutter: 2.3.4
  firebase_core: 3.5.0
